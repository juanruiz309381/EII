# Configuration file for Age Recognition from Voice

# Data paths
data:
  base_path: "audios/organized_by_age"
  output_path: "results"

  # Age category mapping
  # From Common Voice categories to project categories
  category_mapping:
    "teens": "adolescente"           # 13-19 años
    "twenties": "juvenil"            # 20-29 años
    "thirties": "adulto"             # 30-39 años
    "fourties": "adulto"             # 40-49 años
    "fifties": "adulto_mayor"        # 50-59 años
    "sixties": "adulto_mayor"        # 60+ años
    "no_age": null                   # Exclude from training

  # Final categories for classification
  target_categories:
    - "adolescente"
    - "juvenil"
    - "adulto"
    - "adulto_mayor"

# Audio preprocessing
audio:
  sample_rate: 22050
  duration: 3.0  # seconds
  n_mels: 128
  n_fft: 2048
  hop_length: 512
  fmin: 0
  fmax: 8000

# Feature extraction
features:
  # Spectrogram type: "mel", "mfcc", "stft"
  spectrogram_type: "mel"

  # MFCC parameters
  n_mfcc: 40

  # Save spectrograms as images
  save_images: true
  image_size: [224, 224]  # For transfer learning models

# Data augmentation
augmentation:
  enabled: true
  techniques:
    time_stretch:
      enabled: true
      rate_range: [0.8, 1.2]
    pitch_shift:
      enabled: true
      n_steps_range: [-2, 2]
    add_noise:
      enabled: true
      noise_factor: 0.005
    time_shift:
      enabled: true
      shift_max: 0.2

# Conventional Models
conventional_models:
  - name: "random_forest"
    params:
      n_estimators: 200
      max_depth: 20
      min_samples_split: 5
      class_weight: "balanced"
      random_state: 42

  - name: "svm"
    params:
      kernel: "rbf"
      C: 10
      gamma: "scale"
      class_weight: "balanced"
      random_state: 42

  - name: "xgboost"
    params:
      n_estimators: 200
      max_depth: 10
      learning_rate: 0.1
      random_state: 42

# Deep Learning Models
deep_learning:
  # Base model for transfer learning
  transfer_learning:
    enabled: true
    base_model: "VGG16"  # Options: VGG16, ResNet50, MobileNetV2, EfficientNetB0
    trainable_layers: 4  # Number of layers to unfreeze for fine-tuning

  # Custom CNN architecture (if not using transfer learning)
  custom_cnn:
    filters: [32, 64, 128, 256]
    kernel_size: [3, 3]
    pool_size: [2, 2]
    dense_units: [512, 256]

  # Anti-overfitting techniques
  regularization:
    dropout_rate: 0.5
    l2_regularization: 0.001
    batch_normalization: true

  # Training parameters
  training:
    batch_size: 32
    epochs: 100
    learning_rate: 0.0001
    optimizer: "adam"

    # Early stopping
    early_stopping:
      enabled: true
      patience: 15
      min_delta: 0.001
      restore_best_weights: true

    # Learning rate scheduling
    lr_schedule:
      enabled: true
      factor: 0.5
      patience: 5
      min_lr: 0.000001

    # Model checkpointing
    checkpoint:
      enabled: true
      save_best_only: true
      monitor: "val_loss"

# Data split
split:
  train: 0.7
  validation: 0.15
  test: 0.15
  random_state: 42
  stratify: true

# Evaluation metrics
metrics:
  classification:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1_score"

  plots:
    - "confusion_matrix"
    - "roc_curve"
    - "precision_recall_curve"
    - "learning_curves"
    - "feature_importance"  # For conventional models

# Logging
logging:
  level: "INFO"
  save_logs: true
  log_file: "results/training.log"
